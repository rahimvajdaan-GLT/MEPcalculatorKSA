name: Pre-deployment Safety Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pre-deployment-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  safety-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check dependency compatibility
        run: npm ls --all
      - name: Run SEO tests
        run: npm run test:seo
      - name: Run engineering regression tests
        run: |
          node agent/calculation-regression.mjs
          node --test tests/voltage-drop.test.mjs
      - name: Build production bundle
        run: npm run build
