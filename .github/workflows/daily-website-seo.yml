name: Autonomous Website Manager and AI SEO Builder

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: mep-website-manager
  cancel-in-progress: false

jobs:
  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Safely repair sitemap
        run: python3 agent/generate-sitemap.py
      - name: Propose sitemap updates
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/daily-sitemap-refresh
          base: main
          add-paths: public/sitemap.xml
          commit-message: 'chore: automatically refresh sitemap'
          title: 'chore: automatically refresh sitemap'
          body: 'Automated sitemap refresh from the daily website manager.'
      - name: Check website build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Run website maintenance audit
        id: audit
        continue-on-error: true
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: node agent/autonomous-manager.mjs
      - name: Generate AI SEO plan
        if: always()
        run: |
          if [ -f agent-report.json ]; then
            node agent/ai-seo-builder.mjs
          fi
      - name: Save daily reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-manager-report
          path: |
            agent-report.md
            agent-report.json
            agent-ai-plan.md
          retention-days: 30
      - name: Flag confirmed failures
        if: always()
        run: |
          if [[ "${{ steps.build.outcome }}" == "failure" || "${{ steps.audit.outcome }}" == "failure" ]]; then
            exit 1
          fi
